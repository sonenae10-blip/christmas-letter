<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>편지 작성하기 - 크리스마스 편지</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 눈 -->
    <div class="snow-layer slow"></div>
    <div class="snow-layer"></div>
    <div class="snow-layer fast"></div>

    <div class="center-wrapper">
        <h1 class="page-title"><span>크리스마스 편지 작성</span></h1>

        <div class="letter-container">
            <div class="form-row">
                <div style="flex: 1;">
                    <label for="toName">받는 사람</label>
                    <input
                        id="toName"
                        type="text"
                        placeholder="♡♡♡"
                    />
                </div>
                <div style="flex: 1;">
                    <label for="fromName">보내는 사람</label>
                    <input
                        id="fromName"
                        type="text"
                        placeholder="♡♡♡"
                    />
                </div>
            </div>

            <label for="message">편지 내용</label>
            <textarea
                id="message"
                placeholder="여기에 크리스마스 편지를 작성해 주세요 :)"
            ></textarea>

            <p class="helper-text">
                편지를 작성한 뒤 “편지 완성” 버튼을 누르면,<br />
                링크가 만들어지고 상대방은 그 링크로 편지를 열어볼 수 있어요.
            </p>

            <button class="btn" id="createBtn">편지 완성하기</button>
        </div>
    </div>

    <script>
        const createBtn = document.getElementById("createBtn");

        createBtn.addEventListener("click", () => {
            const toName = document.getElementById("toName").value.trim();
            const fromName = document.getElementById("fromName").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!message) {
                alert("편지 내용을 입력해 주세요!");
                return;
            }

            const params = new URLSearchParams();
            if (toName) params.set("to", toName);
            if (fromName) params.set("from", fromName);
            params.set("message", message);

            const url = "view.html?" + params.toString();
            window.location.href = url;
        });
    </script>
</body>
</html>
