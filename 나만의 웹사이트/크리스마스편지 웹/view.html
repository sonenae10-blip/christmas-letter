<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>크리스마스 편지 보기</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 눈 -->
    <div class="snow-layer slow"></div>
    <div class="snow-layer"></div>
    <div class="snow-layer fast"></div>

    <!-- 배경 음악 -->
    <audio id="bgm" loop>
        <source src="christmas.mp3" type="audio/mpeg" />
    </audio>

    <div class="center-wrapper">
        <h1 class="page-title">당신을 위한 크리스마스 편지</h1>

        <!-- 공유 링크 + 복사 버튼 -->
        <div class="link-box">
            <input type="text" id="shareLink" readonly />
            <button class="btn btn-small" id="copyBtn">링크 복사</button>
        </div>

        <!-- 처음에 잠깐 보여줄 편지 내용 박스 -->
        <div class="floating-message" id="floatingMessage"></div>

        <!-- 봉투 + 편지지 -->
        <div class="envelope-wrapper">
            <div class="envelope-base"></div>
            <div class="envelope-flap"></div>
            <div class="letter-paper" id="letterPaper">
                <div class="letter-to" id="letterTo"></div>
                <div class="letter-message" id="letterMessage"></div>
                <div class="letter-from" id="letterFrom"></div>
            </div>
        </div>

        <button class="btn" onclick="goWrite()">나도 편지 만들기 ✍️</button>
    </div>

    <script>
        // 쿼리 파라미터에서 내용 가져오기
        const params = new URLSearchParams(window.location.search);
        const toName = params.get("to") || "";
        const fromName = params.get("from") || "";
        const message = params.get("message") || "";

        const letterToEl = document.getElementById("letterTo");
        const letterMsgEl = document.getElementById("letterMessage");
        const letterFromEl = document.getElementById("letterFrom");
        const floatingMessageEl = document.getElementById("floatingMessage");
        const letterPaperEl = document.getElementById("letterPaper");

        // 받는 사람
        if (toName) {
            letterToEl.textContent = `To. ${toName}`;
        } else {
            letterToEl.textContent = "To. 당신";
        }

        // 줄바꿈 유지한 메시지
        const formattedMsg = (message || "편지 내용이 없어요 😢").replace(
            /\n/g,
            "<br />"
        );

        // 처음에는 floatingMessage에 내용 표시
        floatingMessageEl.innerHTML =
            `<strong>${letterToEl.textContent}</strong><br /><br />` +
            formattedMsg +
            (fromName ? `<br /><br /><span style="float:right;">From. ${fromName}</span>` : "");

        // 나중에 편지지 안에도 같은 내용 넣기
        letterMsgEl.innerHTML = formattedMsg;
        if (fromName) {
            letterFromEl.textContent = `From. ${fromName}`;
        }

        // floatingMessage 애니메이션이 끝난 뒤 편지지가 나타나도록
        floatingMessageEl.addEventListener("animationend", (e) => {
            if (e.animationName === "floatToEnvelope") {
                floatingMessageEl.style.display = "none";
                letterPaperEl.classList.add("show");
            }
        });

        // 공유 링크 표시
        const shareLinkInput = document.getElementById("shareLink");
        shareLinkInput.value = window.location.href;

        const copyBtn = document.getElementById("copyBtn");
        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(shareLinkInput.value);
                copyBtn.textContent = "복사 완료!";
                setTimeout(() => {
                    copyBtn.textContent = "링크 복사";
                }, 1500);
            } catch (err) {
                alert("복사를 지원하지 않는 브라우저예요. 직접 복사해 주세요.");
            }
        });

        // BGM 자동 재생 시도 (막히면 첫 클릭 때 재생)
        const bgm = document.getElementById("bgm");
        bgm.play().catch(() => {
            document.body.addEventListener(
                "click",
                () => {
                    bgm.play().catch(() => {});
                },
                { once: true }
            );
        });

        function goWrite() {
            window.location.href = "write.html";
        }
    </script>
</body>
</html>
